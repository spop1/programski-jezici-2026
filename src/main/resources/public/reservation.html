<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation-schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
        #searchForm {
            display: none !important;
        }
    </style>
</head>

<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-body-secondary d-flex justify-content-between align-items-center py-3">
            <h5 class="card-title mb-0 fw-bold">Reservations</h5>
            <a href="/add-reservation.html" class="btn btn-sm btn-primary">
                <i class="fa-solid fa-plus me-1"></i> Add reservation
            </a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-3">#</th>
                            <th scope="col">Meal</th>
                            <th scope="col">Restaurant</th>
                            <th scope="col">Time</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="text-end pe-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="schedulesTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- External and utility scripts -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="/js/utils.js"></script>

<script>

    function pay(id) {
        showConfirm(`Pay the order #${id}?`, () => {

            fetch(`/api/reservations/${id}/pay`, { method: 'put' })
                .then(rsp => window.location.reload())
        })
    }

    function edit(id) {
        window.location.href = '/edit-reservation.html?id=' + id
    }

    function details(id) {
        window.location.href = '/reservation-details.html?id=' + id;
    }

    function deleteReservation(id) {

        showConfirm(`Are you sure you want to delete this reservation schedule #${id}?`, async () => {
            try {
                const rsp = await fetch(`/api/reservations/${id}`, { method: 'DELETE' })
                if (rsp.ok) {
                    initPageLoad('/api/reservations', '/api/reservations/search?name=', renderReservation)
                } else {
                    Swal.fire({
                        title: "Error!",
                        text: "It can't be deleted'.",
                        icon: "error",
                        customClass: window.bootstrapClasses
                    })
                }
            } catch (error) {
                console.error("An error occurred while deleting:", error)
            }
        });
    }

    function renderReservation(data) {
        console.log("Data from backend:", data)

        const tableBody = document.getElementById('schedulesTable')

        let schedules = Array.isArray(data) ? data : (data?.schedules || [])
        // schedules = schedules.filter(r => r.paidAt == null)

        if (schedules.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No schedules found.</td></tr>`;
            return;
        }

        let content = "";

        for (let schedule of schedules) {
            const scheduleId = schedule.reservationId || 'N/A'
            // const name = schedule.name || 'undefined'
            const recipeName = schedule.recipe?.strMeal || schedule.recipe?.name || 'Unknown Recipe'
            const recipeId = schedule.recipeId || ''
            const restaurantName = schedule.restaurant?.name || 'Unknown Retaurant'
            const timeStart = schedule?.createdAt || ''
            const status = schedule.status

            content += `
                <tr>
                    <th scope="row">${scheduleId}</th>
                    <td>${escapeHTML(name)}</td>
                    <td>${escapeHTML(recipeName)}</td>
                    <td>${escapeHTML(restaurantName)}</td>
                    <td>${escapeHTML(timeStart.slice(12, 17))}h</td>
                    <td>${status === 'PAID' ?
                    `<span class="text-success fw-bold">Paid</span>` :
                    `<span class="text-danger fw-bold">Not paid</span>`
                }
                    </td>

                    <td>
                    <td id="actions-${scheduleId}">
                        ${renderButton(schedule)}
                    </td>
                </tr>
                `
        }

        tableBody.innerHTML = content;
    }

    function renderButton(schedule) {
        const scheduleId = schedule.reservationId || 'N/A'

        if (schedule.status !== 'PAID') {
            return `
                     <div class="d-flex gap-1">
                     <button class="btn btn-sm btn-primary" type="button" onclick="pay(${scheduleId})" title="Kupi">
                         <i class="fa-solid fa-cart-shopping"></i> Buy
                     </button>
                     <button class="btn btn-sm btn-success" type="button" onclick="edit(${scheduleId})" title="Izmeni">
                         <i class="fa-solid fa-pen-to-square"></i>
                     </button>
                     <button class="btn btn-sm btn-danger" type="button" onclick="deleteReservation(${scheduleId})" title="Obriši">
                         <i class="fa-solid fa-trash-can"></i>
                     </button>
                 </div>
                `
        }
        return `
                <div class="d-flex gap-1">
                    <a class="btn btn-sm btn-info" href="/reservation-details.html?id=${scheduleId}">
                        <i class="fa-solid fa-qrcode"></i>
                        </a>
                </div>
            `
    }

    async function loadCompetition() {

        const data = await retrieveData('/api/reservations')

        if (data) renderReservation(data)
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPageLoad('/api/reservations', '/api/reservations/search?name=', renderReservation);
    });
</script>
</body>

</html>
