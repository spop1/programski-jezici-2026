<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body data-search-base="http://localhost:8080/api/restaurants?name=">
  <div class="container my-4">
    <div class="card shadow-sm">
      <div class="card-header fw-bold d-flex justify-content-between align-items-center py-3">
        <h6 class="mb-0 fw-bold">Restaurants</h6>
        <a href="/add-restaurant.html" class="btn btn-sm btn-primary">
          <i class="fa-solid fa-plus me-1"></i> Add a restaurant
        </a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="ps-3">#</th>
                <th scope="col">Name</th>
                <th scope="col">Address</th>
                <th scope="col" class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="restaurants"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="/js/utils.js"></script>

  <script>

    function renderRestaurants(data) {
      const table = document.getElementById('restaurants');
      if (!table) return;

      const restaurants = Array.isArray(data) ? data : (data?.restaurants || []);

      if (restaurants.length === 0) {
        table.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No restaurants.</td></tr>`;
        return;
      }

      let content = "";
      for (let restaurant of restaurants) {
        content += `
          <tr>
            <th scope="row">${restaurant.restaurantId}</th>

            <td>${escapeHTML(restaurant.name)}</td>
            <td>${escapeHTML(restaurant.address)}</td>
            <td>
              <button class="btn btn-sm btn-success me-1" type="button" onclick="edit(${restaurant.restaurantId})" title="Change">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-sm btn-danger" type="button" onclick="deleteRestaurant(${restaurant.restaurantId})" title="Delete">
                 <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      }
      table.innerHTML = content;
    }

    async function loadRestaurants() {
      const data = await retrieveData('/api/restaurants')

      if (data) renderRestaurants(data)
    }

    function edit(id) {
      window.location.href = '/edit-restaurant.html?id=' + id
    }


    function deleteRestaurant(id) {

      showConfirm(`Are you sure you want to delete this restaurant #${id}?`, async () => {
        try {
          const rsp = await fetch(`/api/restaurants/${id}`, { method: 'DELETE' })
          if (rsp.ok) {
            const currentSearch = new URLSearchParams(window.location.search).get('search')
            if (currentSearch) {
              initPageLoad('/api/restaurants', '/api/restaurants?name=', renderRestaurants)
            } else {
              const data = await retrieveData('/api/restaurants')
              renderRestaurants(data)
            }

          } else {
            Swal.fire({
              title: "Error!",
              text: "It can't be deleted'.",
              icon: "error",
              customClass: window.bootstrapClasses
            })
          }
        } catch (error) {
          console.error("An error occurred while deleting:", error)
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPageLoad(
        '/api/restaurants',
        '/api/restaurants?name=',
        renderRestaurants
      )
    })
  </script>
</body>

</html>
