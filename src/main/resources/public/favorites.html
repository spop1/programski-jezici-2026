<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    #searchForm {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container my-4">
    <div id="recipes" class="row g-4"></div>
  </div>
  <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="/js/utils.js"></script>
  <script>
    let favoriteMeals = [];

    function renderMeals(mealsArray) {
      const list = document.getElementById("recipes");
      if (!list) return;

      if (!mealsArray || mealsArray.length === 0) {
        list.innerHTML = `<div class="col-12"><p class="mt-4 text-muted text-center">No recipes found in favorites.</p></div>`;
        return;
      }

      let content = "";

      for (let r of mealsArray) {
        const id = r.idMeal || r.id;
        const title = r.strMeal || r.name || 'Untitled';
        const thumb = r.strMealThumb || r.thumbnail || '';
        const rawInstructions = r.strInstructions || r.instructions || 'No description available.';

        const instructions = rawInstructions.length > 100
          ? rawInstructions.substring(0, 100) + '...'
          : rawInstructions;

        content += `
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 shadow-sm">
        <a href="details.html?id=${encodeURIComponent(id)}">
          <img src="${escapeHTML(thumb)}" class="card-img-top" alt="${escapeHTML(title)}" loading="lazy">
        </a>

        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title">${escapeHTML(title)}</h5>
            <p class="card-text small text-muted">${escapeHTML(instructions)}</p>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <a href="details.html?id=${encodeURIComponent(id)}" class="btn btn-primary btn-sm">
              <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Details
            </a>

            <button class="btn btn-outline-danger btn-sm" onclick="toggleFavorite('${id}')" title="Remove">
              <i class="fa-solid fa-heart text-danger"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    `;
      }

      list.innerHTML = content;
    }

    // Removes card from DOM state immediately when toggled off
    function toggleFavorite(id) {
      toggleFavoriteId(id);
      favoriteMeals = favoriteMeals.filter(r => String(r.idMeal || r.id) !== String(id));
      renderMeals(favoriteMeals);
    }

    async function loadFavorites() {
      const favoritesIds = Array.from(getFavorites());

      if (favoritesIds.length === 0) {
        renderMeals([]);
        return;
      }

      try {
        const fetchPromises = favoritesIds.map(async (id) => {
          try {
            const data = await retrieveData(`/api/meals/${id}`);
            return (data && data.meals) ? data.meals[0] : data;
          } catch (err) {
            return null;
          }
        });

        const data = await Promise.all(fetchPromises);
        favoriteMeals = data.filter(meal => meal !== null);
        renderMeals(favoriteMeals);
      } catch (err) {
        console.error("Error loading favorites:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadFavorites);
  </script>
</body>

</html>
