<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body data-search-base="/list.html?search=">
  <div class="container my-4">
    <div class="card">
      <div class="card-header fw-bold">
        <h6 class="mb-0 fw-bold">Recipes</h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Category</th>
                <th scope="col">Country</th>
                <th scope="col" class="text-end pe-3">Details</th>
              </tr>
            </thead>
            <tbody id="recipes"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
  <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="/js/utils.js"></script>

  <script>
    function renderTable(data) {
      const tableBody = document.getElementById('recipes');
      if (!tableBody) return;

      const meals = Array.isArray(data) ? data : (data?.meals || []);

      if (meals.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No recipes found.</td></tr>`;
        return;
      }

      const sortedMeals = meals.sort((r1, r2) => Number(r1.idMeal || r1.id) - Number(r2.idMeal || r2.id));

      let content = "";

      for (let meal of sortedMeals) {
        const id = meal.idMeal || meal.id;
        const name = meal.strMeal || meal.name || 'Unknown Recipe';
        const category = meal.strCategory || 'Unknown';
        const area = meal.strArea || 'Unknown';

        content += `
          <tr>
            <th scope="row">${id}</th>
            <td>${escapeHTML(name)}</td>
            <td>${escapeHTML(category)}</td>
            <td>${escapeHTML(area)}</td>
            <td>
              <a href="details.html?id=${encodeURIComponent(id)}" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Details
              </a>  
            </td>
          </tr>
        `;
      }

      tableBody.innerHTML = content;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPageLoad('/api/meals', '/api/meals/search?name=', renderTable);
    });
  </script>
</body>

</html>
