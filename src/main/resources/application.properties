spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/reservation-mysql
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=spring
spring.datasource.password=spring
meal.api.base-url=https://www.themealdb.com/api/json/v1/1
#Kompresija na serveru
server.compression.enabled=true
# Tipovi podataka koje želimo da kompresujemo 
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
# Minimalna veličina odgovora (u bajtovima) za koju se isplati raditi kompresiju ~0.5KB
server.compression.min-response-size=500
server.port=8888
#Automatski ažurira bazu ako promenimo nešto u Entity
spring.jpa.hibernate.ddl-auto=update
# Grupisanje više INSERT/UPDATE upita u jedan paket (za rad sa listama)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Vraćanje konekcije u bazen čim se pročitaju podaci sa baze (brže oslobađanje resursa)
spring.jpa.open-in-view=false

# HikariCP - održavanje otvorenih konekcija ka bazi
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.cloud.openfeign.circuitbreaker.enabled=true

# Circuit Breaker configuration for micro-service
resilience4j.circuitbreaker.instances.mealService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mealService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mealService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.mealService.minimumNumberOfCalls=5

spring.application.name=reservation-service
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/