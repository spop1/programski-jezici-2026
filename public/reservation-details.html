<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
        #searchForm {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="crud-container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/index.html">Home</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="/reservation.html">Reservation</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Details</li>
                </ol>
            </nav>
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img id="qr-code" class="img-fluid rounded-start" alt="...">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h5 class="card-title" id="title"></h5>
                            <p class="card-text">
                                <small class="text-body-secondary" id="time"></small><br>
                                <small class="text-body-secondary" id="paid"></small><br>
                                <small class="text-body-secondary" id="sub"></small>
                            </p>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <pre id="json"></pre>
    </div>

    <!-- External and utility scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/utils.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search)
        const id = params.get('id');

        // Fetch and display data once the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', async () => {
            const jsonContainer = document.getElementById('json')
            if (!id) {
                jsonContainer.innerText = "Error: Missing ID in the URL (e.g., ?id=9)"
                return
            }

            try {
                const data = await retrieveData(`/api/reservations/${id}`)

                if (!data) {
                    jsonContainer.innerText = "No data found.";
                    return;
                }

                document.getElementById('json').innerHTML = JSON.stringify(data, null, 2)

                const qrCode = document.getElementById('qr-code')
                const code = `${data.reservationId}-${data.recipe.strMeal}-${data.timeStart.slice(0, 10)}`
                qrCode.src = `https://api.qrserver.com/v1/create-qr-code/?size=460x460&data=${code}`
                qrCode.alt = code

                const title = document.getElementById('title')
                title.innerText = `${data.recipe.strMeal} in ${data.timeStart.slice(11, 16)}h`

                const paid = document.getElementById('paid')
                paid.innerText = data.status === 'PAID' || data.status === 'TAKEOVER' ? "Paid" : "Not paid"

                const sub = document.getElementById('sub')
                sub.innerText = code

            } catch (error) {
                console.error("Failed to load reservation details:", error)
                jsonContainer.innerText = "Failed to load data. Check console for details."
            }
        });
    </script>
</body>

</html>
