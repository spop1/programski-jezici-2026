<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition-schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container my-4">
        <div class="card">
            <div class="card-header fw-bold">
                <h6>Participiants</h6>
                <a href="/new-competition.html" class="btn btn-sm btn-primary btn-sm">
                    <i class="fa-solid fa-plus me-1"></i> Add a competition
                </a>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Name</th>
                            <th scope="col">Recipe</th>
                            <th scope="col">Restaurant</th>
                            <th scope="col">Start Projection</th>
                            <th scope="col">Details</th>
                        </tr>
                    </thead>
                    <tbody id="schedulesTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- External and utility scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/utils.js"></script>

    <script>

        function edit(id) {
            window.location.href = '/edit-competition.html?id=' + id
        }


        function deleteCompetition(id) {

            showConfirm(`Are you sure you want to delete this competition schedule #${id}?`, async () => {
                try {
                    const rsp = await fetch(`/api/competition/${id}`, { method: 'DELETE' })
                    if (rsp.ok) {
                        initPageLoad('/api/competition', '/api/competition/search?name=', renderCompetition)
                    } else {
                        Swal.fire({
                            title: "Error!",
                            text: "It can't be deleted'.",
                            icon: "error",
                            customClass: window.bootstrapClasses
                        })
                    }
                } catch (error) {
                    console.error("An error occurred while deleting:", error)
                }
            });
        }

        function renderCompetition(data) {
            const tableBody = document.getElementById('schedulesTable');

            const schedules = Array.isArray(data) ? data : (data?.schedules || []);

            if (schedules.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No schedules found.</td></tr>`;
                return;
            }

            let content = "";

            for (let schedule of schedules) {
                const scheduleId = schedule.competitionId || 'N/A'
                const name = schedule.name || 'undefined'
                const recipeName = schedule.recipe?.strMeal || 'Unknown Recipe'
                const recipeId = schedule.recipeId || ''
                const restaurantName = schedule.restaurant?.name || 'Unknown Retaurant'
                const timeStart = schedule.timeStart 
                ? new Date(schedule.timeStart).toLocaleTimeString('sr-RS'): 'TBD'

                content += `
                  <tr>
                    <th scope="row">${scheduleId}</th>
                    <td>${escapeHTML(name)}</td>
                    <td>${escapeHTML(recipeName)}</td>
                    <td>${escapeHTML(restaurantName)}</td>
                    <td>${escapeHTML(timeStart)}</td>
                    <td>
                      <button class="btn btn-sm btn-success me-1" type="button" onclick="edit(${scheduleId})" title="Change">
                        <i class="fa-solid fa-pen-to-square"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" type="button" onclick="deleteCompetition(${scheduleId})" title="Delete">
                         <i class="fa-solid fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                `;
            }

            tableBody.innerHTML = content;
        }

        async function loadCompetition() {
      const data = await retrieveData('/api/competition')

      if (data) renderCompetition(data)
    }

        document.addEventListener('DOMContentLoaded', () => {
            initPageLoad('/api/competition', '/api/competition/search?name=', renderCompetition);
        });
    </script>
</body>

</html>
