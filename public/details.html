    <div class="container my-4">
        <div class="row">
            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="fw-bold mb-0"><span id="recipe"></span></h3>
                    </div>
                    <img id="thumbrl" class="img-fluid mx-auto p-3">
                    <div class="card-body mt-auto">
                        <a id="youtube" class="btn btn-danger w-100" target="_blank" hidden>
                            <i class="fa-brands fa-youtube me-2"></i>Watch on YouTube
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 mb-3">

                    </div>
                    <div class="card-body">
                        <p id="desc" class="card-text"></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-header fw-bold" id="title">
                        <h4 class="mb-0"><i class="fa-solid fa-mortar-pestle me-2"></i>Ingredients</h4>
                    </div>
                    <div class="card-body">
                        <div id="ingredients" class="row"></div>
                    </div>
                </div>
            </div>

   <!-- External and utility scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="/js/utils.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        // CALLBACK function for appending recipe details
        function renderDetails(data) {
            if (!data.meals || data.meals.length === 0) return;

            const meal = data.meals[0];

            document.getElementById('thumbrl').src = meal.strMealThumb;
            document.getElementById('recipe').innerText = meal.strMeal;

            if (meal.strYoutube && meal.strYoutube.trim() !== "") {
                const yt = document.getElementById('youtube');
                yt.href = meal.strYoutube;
                yt.hidden = false;
            }

            const ingredients = document.getElementById('ingredients');
            ingredients.innerHTML = ""; // Clear before appending

            for (let i = 1; i <= 20; i++) {
                let ingredient = meal["strIngredient" + i];
                let measure = meal["strMeasure" + i];

                if (ingredient && ingredient.trim() !== "" && ingredient.trim() !== ",") {
                    const div = document.createElement("div");
                    div.className = "col-12 col-sm-6 mb-2";
                    div.innerText = (measure ? measure : "") + " " + ingredient;
                    ingredients.appendChild(div);
                }
            }

            document.getElementById('desc').innerText = meal.strInstructions;
        }

        function loadDetails() {
            if (!id) return;
            const API_URL = "https://www.themealdb.com/api/json/v1/1/lookup.php?i=" + id;
            retrieveData(API_URL, renderDetails);
        }

        document.addEventListener('DOMContentLoaded', loadDetails);
    </script>
