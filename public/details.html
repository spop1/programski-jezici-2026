<body>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">

          <li class="nav-item">

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h3 class="fw-bold mb-3"><span id="recipe"></span></h3>
                    </div>
                    <img id="thumbrl" class="img-fluid mx-auto mb-3">
                    <div class="card-body mb-3">
                        <a id="youtube" class="btn btn-danger" target="_blank" hidden>
                            Watch on YouTube
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card mb-3">
                    <div class="card-header fw-bold">
                        <h2><i class="fa-brands fa-readme"></i>Method</h2>
                    </div>
                    <div class="card-body text-justify">
                        <p id="desc"></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card mb-3">
                    <div class="card-header fw-bold" id="title">
                        <h2><i class="fa-solid fa-mortar-pestle"></i>Ingredients</h2>
                    </div>
                    <div id="ingredients" class="row">

                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

        const params = new URLSearchParams(window.location.search)
        const id = params.get('id')
        fetch("https://www.themealdb.com/api/json/v1/1/lookup.php?i=" + id)
            .then(rsp => rsp.json())
            .then(data => {

                const meal = data.meals[0]

                const thumbrl = document.getElementById('thumbrl')
                thumbrl.src = meal.strMealThumb

                document.getElementById('recipe').innerText = meal.strMeal

                if (meal.strYoutube.length > 0) {
                    const yt = document.getElementById('youtube')
                    yt.href = meal.strYoutube
                    yt.hidden = false
                }

                const ingredients = document.getElementById('ingredients')

                for (let i = 1; i <= 20; i++) {
                    let ingredient = meal["strIngredient" + i]
                    let measure = meal["strMeasure" + i]

                    if (ingredient && ingredient.trim() != "") {
                        const div = document.createElement("div")

                        div.innerText = measure + " " + ingredient
                        ingredients.appendChild(div)
                    }
                }

                const prep = document.getElementById('desc')
                prep.innerText = meal.strInstructions
            })
    </script>
