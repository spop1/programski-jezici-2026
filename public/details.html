<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container my-4">
        <div class="row">
            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="fw-bold mb-0"><span id="recipe"></span></h3>

                        <button type="button" id="favBtn" class="btn btn-light border btn-sm"
                            onclick="event.preventDefault(); toggleFavoriteDetails()" title="Favorite">
                            <i id="favIcon" class="fa-solid fa-heart text-secondary"></i>
                        </button>
                    </div>
                    <img id="thumbrl" class="img-fluid mx-auto p-3">
                    <div class="card-body mt-auto">
                        <a id="youtube" class="btn btn-danger w-100" target="_blank" hidden>
                            <i class="fa-brands fa-youtube me-2"></i>Watch on YouTube
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-header fw-bold">
                        <h4 class="mb-0"><i class="fa-brands fa-readme me-2"></i>Method</h4>
                    </div>
                    <div class="card-body">
                        <p id="desc" class="card-text"></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-header fw-bold" id="title">
                        <h4 class="mb-0"><i class="fa-solid fa-mortar-pestle me-2"></i>Ingredients</h4>
                    </div>
                    <div class="card-body">
                        <div id="ingredients" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External and utility scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="/js/utils.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        function toggleFavoriteDetails() {
            if (!id) return;

            const isFav = toggleFavoriteId(id);
            const favIcon = document.getElementById('favIcon');

            if (isFav) {
                favIcon.classList.replace('text-secondary', 'text-danger');
            } else {
                favIcon.classList.replace('text-danger', 'text-secondary');
            }
        }

        // CALLBACK function for appending recipe details
        function renderDetails(data) {
            if (!data) return;

            const meal = data.meals ? data.meals[0] : data;
            if (!meal) return;

            document.getElementById('thumbrl').src = meal.strMealThumb;
            document.getElementById('recipe').innerText = meal.strMeal;

            const favorites = getFavorites();
            if (favorites.has(String(id))) {
                document.getElementById('favIcon').classList.replace('text-secondary', 'text-danger');
            }

            if (meal.strYoutube && meal.strYoutube.trim() !== "") {
                const yt = document.getElementById('youtube');
                yt.href = meal.strYoutube;
                yt.hidden = false;
            }

            const ingredients = document.getElementById('ingredients')
            ingredients.innerHTML = ""

            if (meal.ingredients && Array.isArray(meal.ingredients)) {
                for (let ing of meal.ingredients) {
                    const name = ing.name;
                    const measure = ing.measure;

                    if (name && name.trim() !== "") {
                        const div = document.createElement("div")
                        div.className = "col-12 col-sm-6 mb-2"
                        div.innerText = `${measure} ${name}`.trim()
                        ingredients.appendChild(div)
                    }
                }
            }

            document.getElementById('desc').innerText = meal.strInstructions
        }

        async function loadDetails() {
            if (!id) return;

            const API_URL = `/api/meals/${id}`;
            const data = await retrieveData(API_URL);

            if (!data) return;

            renderDetails(data);
        }

        document.addEventListener('DOMContentLoaded', loadDetails);
    </script>
</body>

</html>
