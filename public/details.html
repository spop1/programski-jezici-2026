<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <i class="fa-solid fa-bowl-food mb-2"></i>Recipes
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto me-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">
                            <i class="fa-solid fa-house mb-2"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="./favorites.html">
                            <i class="fa-solid fa-bookmark me-2"></i>Favorites
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="./list.html">
                            <i class="fa-solid fa-list me-2"></i>List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="./restaurant.html">
                            <i class="fa-solid fa-utensils me-2"></i>Restaurant
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h3 class="fw-bold mb-3"><span id="recipe"></span></h3>
                    </div>
                    <img id="thumbrl" class="img-fluid mx-auto mb-3">
                    <div class="card-body mb-3">
                        <a id="youtube" class="btn btn-danger" target="_blank" hidden>
                            <i class="fa-brands fa-youtube me-2"></i>Watch on YouTube
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card mb-3">
                    <div class="card-header fw-bold">
                        <h2><i class="fa-brands fa-readme"></i>Method</h2>
                    </div>
                    <div class="card-body text-justify">
                        <p id="desc"></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card mb-3">
                    <div class="card-header fw-bold" id="title">
                        <h2><i class="fa-solid fa-mortar-pestle"></i>Ingredients</h2>
                    </div>
                    <div id="ingredients" class="row">

                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script>

        const params = new URLSearchParams(window.location.search)
        const id = params.get('id')

        async function loadDetails() {
            try {
                const rsp = await fetch("https://www.themealdb.com/api/json/v1/1/lookup.php?i=" + id)
                if (!rsp.ok) throw new Error("HTTP error! Status: " + rsp.status)

                const data = await rsp.json()
                const meal = data.meals[0]

                const thumbrl = document.getElementById('thumbrl')
                thumbrl.src = meal.strMealThumb

                document.getElementById('recipe').innerText = meal.strMeal

                if (meal.strYoutube && meal.strYoutube.trim() !== "") {
                    const yt = document.getElementById('youtube')
                    yt.href = meal.strYoutube
                    yt.hidden = false
                }

                const ingredients = document.getElementById('ingredients')

                for (let i = 1; i <= 20; i++) {
                    let ingredient = meal["strIngredient" + i]
                    let measure = meal["strMeasure" + i]

                    if (ingredient && ingredient.trim() !== "" && ingredient.trim() !== ",") {
                        const div = document.createElement("div")
                        div.className = "col-12 col-sm-6 mb-2" // Svaki sastojak zauzima pola reda i ima donju marginu
                        div.innerText = (measure ? measure : "") + " " + ingredient
                        ingredients.appendChild(div)
                    }
                }
                document.getElementById('desc').innerText = meal.strInstructions
            } catch (error) {
                console.log("Error", error)
            }
        }

        document.addEventListener('DOMContentLoaded', loadDetails)

    </script>
</body>

</html>
