<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="./index.html">
        <i class="fa-solid fa-bowl-food"></i>Recipes
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="./index.html">
              <i class="fa-solid fa-house me-2"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./favorites.html">
              <i class="fa-solid fa-bookmark me-2"></i>Favorites
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./list.html">
              <i class="fa-solid fa-list me-2"></i>List
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./restaurant.html">
              <i class="fa-solid fa-utensils me-2"></i>Restaurant
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-4">
    <div id="recipes" class="row g-4"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
  <script>
    let favoriteMeals = []

    function getFavorites() {
      return JSON.parse(localStorage.getItem("favorites")) ?? []
    }

    function saveFavorites(favorites) {
      localStorage.setItem("favorites", JSON.stringify(favorites))
    }

    function renderMeals(mealsArray) {
      const list = document.getElementById("recipes")

      if (mealsArray.length === 0) {
        list.innerHTML = `<p class="mt-4">Nema favorita.</p>`
        return
      }

      let content = ""

      for (let r of mealsArray) {
        const instructions = r.strInstructions
          ? r.strInstructions.substring(0, 100) + '...'
          : 'Nema opisa.'

        content += `
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 shadow-sm">
        <a href="details.html?id=${r.idMeal}">
          <img src="${r.strMealThumb}" class="card-img-top" alt="${r.strMeal}" loading="lazy">
        </a>

        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title">${r.strMeal}</h5>
            <p class="card-text small text-muted">
              ${instructions}
            </p>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <a href="details.html?id=${r.idMeal}" class="btn btn-primary btn-sm">
              <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>
              Details
            </a>

            <button class="btn btn-outline-danger btn-sm" onclick="toggleFavorite('${r.idMeal}')" title="Ukloni iz favorita">
              <i class="fa-solid fa-heart text-danger"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  `
      }

      list.innerHTML = content
    }

    function toggleFavorite(id) {
      let favorites = new Set(getFavorites())

      if (favorites.has(id)) {
        favorites.delete(id)
      } else {
        favorites.add(id)
      }

      saveFavorites([...favorites])

      // Remove a deleted recipe from array and render again
      favoriteMeals = favoriteMeals.filter(r => r.idMeal !== id)
      renderMeals(favoriteMeals)
    }

    // Async učitavanje svih omiljenih recepata pomoću Promise.all i await
    async function loadFavorites() {
      const favorites = getFavorites()

      if (favorites.length === 0) {
        renderMeals([])
        return
      }

      try {
        const fetchPromises = favorites.map(async (id) => {
          const rsp = await fetch("https://www.themealdb.com/api/json/v1/1/lookup.php?i=" + id)
          if (!rsp.ok) return null
          const data = await rsp.json()
          return data.meals ? data.meals[0] : null
        })

        const data = await Promise.all(fetchPromises)
        favoriteMeals = data.filter(meal => meal !== null)
        renderMeals(favoriteMeals)

      } catch (err) {
        console.error("Greška pri učitavanju favorita:", err)
      }
    }
    // map pravi više zahteva, Promise.all čeka sve njih, a renderMeals ih prikazuje

    document.addEventListener('DOMContentLoaded', loadFavorites);
  </script>
</body>

</html>
