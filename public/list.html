<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .recipes-card {
      width: 22rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="./index.html">
        <i class="fa-solid fa-bowl-food"></i>Recipes
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="./index.html">
              <i class="fa-solid fa-house"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./favorites.html">
              <i class="fa-solid fa-bookmark">
              </i>Favorites
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./list.html">
              <i class="fa-solid fa-table-list"></i>
              </i>Lista
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./restaurant.html">
              <i class="fa-solid fa-utensils"></i>
              </i>Restorani
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Country</th>
          <th scope="col">Details</th>
        </tr>
      </thead>
      <tbody id="recipes"></tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    async function loadRecipes() {

      const rsp = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?s=")
      const data = await rsp.json()

      const recipe = document.getElementById('recipes')

      const sorted = data.meals.sort((r1, r2) => {
        return r2.idMeal - r1.idMeal;
      })

      let content = ""

      for (let meal of sorted) {
        content += `
                  <tr>
                        <th scope="row">${meal.idMeal}</th>
                        <td>${meal.strMeal}</td>
                        <td>${meal.strCategory}</td>
                        <td>${meal.strArea}</td>
                        <td>
                           <a href="details.html?id=${meal.idMeal}" class="btn btn-primary">
                             <i class="fa-solid fa-arrow-up-right-from-square"></i>Details
                           </a>  
                        </td>
                  </tr>
                `
      }
      recipe.innerHTML = content
    }
    loadRecipes()
  </script>
</body>

</html>
