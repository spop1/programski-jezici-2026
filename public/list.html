<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">

      <a class="navbar-brand" href="./index.html">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="./index.html">
              <i class="fa-solid fa-house me-2"></i>Home

          <li class="nav-item">

  <div class="container my-4">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Country</th>
          <th scope="col">Details</th>
        </tr>
      </thead>
      <tbody id="recipes"></tbody>
    </table>
  </div>
   <!-- External and utility scripts -->
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="/js/utils.js"></script>

  <script>

    function renderTable(data) {
      const tableBody = document.getElementById('recipes')
      const meals = data.meals || []

      if (meals.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No recipes.</td></tr>`;
        return;
      }

      const sortedMeals = meals.sort((r1, r2) => Number(r1.idMeal) - Number(r2.idMeal));

      let content = "";

      for (let meal of sortedMeals) {
        content += `
          <tr>
            <th scope="row">${meal.idMeal}</th>
            <td>${meal.strMeal}</td>
            <td>${meal.strCategory}</td>
            <td>${meal.strArea || 'Unknown'}</td>
            <td>
              <a href="details.html?id=${meal.idMeal}" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Details
              </a>  
            </td>
          </tr>
        `;
      }

      tableBody.innerHTML = content;
    }
    function loadRecipes() {
      const API_URL = "/api/meals";
      retrieveData(API_URL, renderTable);
    }

    document.addEventListener('DOMContentLoaded', loadRecipes);

  </script>
</body>

</html>
