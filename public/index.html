<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="./index.html">
        <i class="fa-solid fa-bowl-food me-2"></i>Recipes

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./index.html">
              <i class="fa-solid fa-house me-2"></i>Home
            </a>

          <li class="nav-item">

        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="recipes" class="row g-4"></div>
  </div>

  <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
  </script>
  <script src="/js/utils.js"></script>

  <script>
    let meals = []

    function handleRecipesData(data) {
      console.log("3. The data came from server:", data);
      meals = data.meals || []
      console.log("4. The parsed meals:", meals);
      renderMeals(meals)
    }

    function renderMeals(mealsArray) {
      const list = document.getElementById('recipes')
      const favorites = getFavorites()

      let content = ''

      for (let r of mealsArray) {
        const rawInstructions = r.strInstructions || "No description"
        const instructions = rawInstructions.length > 100
          ? rawInstructions.substring(0, 100) + '...'
          : rawInstructions

        content += `
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm">
            <a href="details.html?id=${r.idMeal}">
              <img src="${r.strMealThumb}" class="card-img-top" alt="${r.strMeal}" loading="lazy">
            </a>

            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h5 class="card-title">${r.strMeal}</h5>

                <p class="card-text small text-muted">
                  ${instructions}
                </p>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-3">
                <a href="details.html?id=${r.idMeal}" class="btn btn-primary btn-sm">
                  <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>
                  Details
                </a>
                <button class="btn btn-light border btn-sm" onclick="toggleFavorite('${r.idMeal}')" title="Omiljeni">
                  <i class="fa-solid fa-heart ${favorites.has(r.idMeal) ? "text-danger" : "text-secondary"}"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `
      }

      list.innerHTML = content
    }

    function toggleFavorite(id) {
      let favorites = getFavorites();

      const stringId = String(id)
      if (favorites.has(stringId)) {
        favorites.delete(stringId)
      } else {
        favorites.add(stringId)
      }

      saveFavorites(favorites)

      renderMeals(meals)
    }

    function loadRecipes() {
      console.log("1.The loadRecipes function started")
      const apiMealsUrl = "/api/meals"

      console.log("2.I'am calling retreiveData with URL:", apiMealsUrl)
      retrieveData(apiMealsUrl, handleRecipesData)
    }

    document.addEventListener('DOMContentLoaded', () => { 
      console.log("0. DOM is ready, I am calling the loadRecipes...")
      loadRecipes() });
  </script>
</body>

</html>
