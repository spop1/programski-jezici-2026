<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body data-search-base="/api/meals/search?name=">
  <div class="container my-4">
    <div id="mealsContainer" class="row g-4"></div>
  </div>
  <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
  <script src="/js/utils.js"></script>

  <script>
    let currentMeals = [];

    function renderMeals(data) {
      const list = document.getElementById('mealsContainer');
      if (!list) return;

      currentMeals = Array.isArray(data) ? data : (data?.meals || []);
      const favorites = getFavorites();

      if (currentMeals.length === 0) {
        list.innerHTML = '<div class="col-12"><p class="text-center text-muted">No recipes found.</p></div>';
        return;
      }

      let content = '';

      for (let r of currentMeals) {
        const id = r.idMeal || r.id;
        const title = r.strMeal || r.name || 'Untitled';
        const thumb = r.strMealThumb || r.thumbnail || '';
        const rawInstructions = r.strInstructions || r.instructions || "No description available.";

        const instructions = rawInstructions.length > 100
          ? rawInstructions.substring(0, 100) + '...'
          : rawInstructions;

        const isFav = favorites.has(String(id));

        content += `
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <a href="details.html?id=${encodeURIComponent(id)}">
            <img src="${escapeHTML(thumb)}" class="card-img-top" alt="${escapeHTML(title)}" loading="lazy">
          </a>

          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">${escapeHTML(title)}</h5>
              <p class="card-text small text-muted">${escapeHTML(instructions)}</p>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
              <a href="details.html?id=${encodeURIComponent(id)}" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Details
              </a>
             <button type="button" class="btn btn-light border btn-sm" onclick="event.preventDefault(); toggleFavorite('${id}')" title="Favorite">
  <i class="fa-solid fa-heart ${isFav ? "text-danger" : "text-secondary"}"></i>
</button>
            </div>
          </div>
        </div>
      </div>
    `;
      }

      list.innerHTML = content;
    }

    // Re-renders only currently displayed filtered items on toggle
    function toggleFavorite(id) {
      toggleFavoriteId(id);
      renderMeals(currentMeals);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPageLoad('/api/meals', '/api/meals/search?name=', renderMeals);
    });
  </script>
</body>

</html>
