<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="./index.html">
        <i class="fa-solid fa-bowl-food me-2"></i>Recipes
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="./index.html">
              <i class="fa-solid fa-house me-2"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./favorites.html">
              <i class="fa-solid fa-bookmark me-2"></i>Favorites
            </a>
          </li> 
          <li class="nav-item">
            <a class="nav-link" href="./list.html">
              <i class="fa-solid fa-list me-2"></i>List
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./restaurant.html">
              <i class="fa-solid fa-utensils me-2"></i>Restaurant
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Restaurants</h2>
      <a href="/new-restaurant.html" class="btn btn-sm btn-primary">
        <i class="fa-solid fa-plus me-1"></i> Add a restaurant
      </a>
    </div>

    <table class="table align-middle">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Name</th>
          <th scope="col">Address</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="restaurants"></tbody>
    </table>
  </div>
 <!-- External and utility scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="/js/utils.js"></script>

  <script>

    function renderRestaurants(data) {
      const table = document.getElementById('restaurants');
      const restaurants = data || [];

      if (restaurants.length === 0) {
        table.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No restaurants.</td></tr>`;
        return;
      }

      let content = "";
      for (let restaurant of restaurants) {
        content += `
          <tr>
            <th scope="row">${restaurant.restaurantId}</th>
            <td>${restaurant.name}</td>
            <td>${restaurant.address}</td>
            <td>
              <button class="btn btn-sm btn-success me-1" type="button" onclick="edit(${restaurant.restaurantId})" title="Change">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-sm btn-danger" type="button" onclick="remove(${restaurant.restaurantId})" title="Delete">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      }
      table.innerHTML = content;
    }

    function loadRestaurants() {
      retrieveData('/api/restaurant', renderRestaurants)
    }

    function edit(id) {
      window.location.href = '/edit-restaurant.html?id=' + id
    }

   
    function remove(id) {
      
      showConfirm(`Are you sure you want to delete this restaurant #${id}?`, async () => {
        try {
          const rsp = await fetch(`/api/restaurant/${id}`, { method: 'DELETE' })
          if (rsp.ok) {
            loadRestaurants()
          } else {
            Swal.fire({
              title: "Error!",
              text: "It can't be deleted'.",
              icon: "error",
              customClass: window.bootstrapClasses
            })
          }
        } catch (error) {
          console.error("An error occurred while deleting:", error)
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadRestaurants)
  </script>
</body>

</html>
