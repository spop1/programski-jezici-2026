  <div class="container">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Name</th>
          <th scope="col">Address</th>

        </tr>

    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
  <script>

    async function remove(id) {
        if (!confirm(`Delete the restaurant ${id}?`)) return

        try {
            const rsp = await fetch(`/api/restaurant/${id}`, {method: 'delete'})
            if (rsp.ok) {
                loadRestaurants()  
            } else {
                alert("Error!")
            }
              } catch (error) {
                  console.error("Greska pri brisanju:", error)
              }
    }

    async function loadRestaurants() {
      try {
          const rsp = await fetch('/api/restaurant')
          if (!rsp.ok) throw new Error(`HTTP greska! Status: ${rsp.status}`)
          const data = await rsp.json()
          const table = document.getElementById('restaurants')

          let content = ""
          for (let restaurant of data) {
            content += `
                    <tr>
                      <td scope="row">${restaurant.restaurantId}</td>
                      <td>${restaurant.name}</td>
                      <td>${restaurant.address}</td>
                      <td>
                          <button class="btn btn-sm btn-success" type="button" onclick="edit(${restaurant.restaurantId})">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" type="button" onclick="remove(${restaurant.restaurantId})">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                      </td>
                    </tr>
              `
      }
      table.innerHTML = content
      } catch (error) {
    console.error("Došlo je do greške u fetch-u:", error);
      }
    }

    loadRestaurants()
