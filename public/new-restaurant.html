<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <strong class="h5 mb-0"><i class="fa-solid fa-plus me-2"></i>Add a new restaurant</strong>
                    </div>
                    <form id="restaurant-form">
                        <div id="alert-container" class="px-3 pt-3"></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name:</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter restaurant name">
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address:</label>
                                <input type="text" id="address" class="form-control"
                                    placeholder="Enter restaurant address">
                            </div>
                        </div>
                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <a href="./restaurant.html" class="btn btn-secondary btn-sm">
                                <i class="fa-solid fa-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-success" id="save">
                                <i class="fa-solid fa-floppy-disk me-1"></i>Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- External and utility scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/utils.js"></script>

    <script>
        const inputName = document.getElementById('name');
        const inputAddress = document.getElementById('address');
        const formId = document.getElementById('restaurant-form');
        const alertContainer = document.getElementById('alert-container');

        function openAll() {
            window.location.href = './restaurant.html';
        }

        // A showing alert Bootstrap helper method, default is danger
        function showAlert(message, type = 'danger') {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        // Customized saving function (POST)
        async function addRestaurant() {
            // Validation blank fields 
            if (!inputName.value.trim() || !inputAddress.value.trim()) {
                showAlert('Please fill in all required fields!', 'warning');
                return;
            }

            try {
                // Safety check before calling the global loading spinner
                if (typeof showLoading === 'function') showLoading();

                const response = await fetch(`/api/restaurant`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: inputName.value.trim(),
                        address: inputAddress.value.trim()
                    })
                });

                if (!response.ok) {
                    throw new Error('The server rejected the addition.');
                }

                // Safety check before closing the modal
                if (typeof Swal !== 'undefined' && Swal.close) Swal.close();
                openAll();

            } catch (error) {
                console.error('An error occured while saving:', error);
                if (typeof Swal !== 'undefined' && Swal.close) Swal.close();
                showAlert('Failed to save the new restaurant to the database.');
            }
        }

        // Wrapper: Wait for the DOM to fully load before initializing event listeners
        document.addEventListener('DOMContentLoaded', function () {
            formId?.addEventListener('submit', function (event) {
                event.preventDefault();
                addRestaurant();
            });
        });
    </script>
</body>

</html>
